<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Outpost World 3D</title>
<!-- Every base in the current Mission
     Control season from game.mc::players, in one 3D world; the viewer's base is in the
     middle at 2.5x, the top three on podiums, everyone else in rings by production rank. -->
<style>
    :root {
        --bg: #070a12; --panel: rgba(12,16,26,0.86); --line: rgba(232,160,32,0.28);
        --ink: #ece4d0; --muted: #9aa3b2; --gold: #e8a020;
    }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
        font: 14px/1.4 'Segoe UI', system-ui, sans-serif; overflow: hidden; }
    #view { position: fixed; inset: 0; display: block; }
    .hud { position: fixed; left: 16px; top: 16px; background: var(--panel); border: 1px solid var(--line);
        border-radius: 12px; padding: 10px 14px; max-width: 300px; backdrop-filter: blur(4px); }
    .hud h1 { margin: 0 0 4px; font-size: 1.05em; color: var(--gold); letter-spacing: 0.02em; }
    .hud p { margin: 0; color: var(--muted); font-size: 0.85em; }
    .hud .row { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
    .hud button, .hud input { font: inherit; font-size: 0.85em; border-radius: 8px; border: 1px solid var(--line);
        background: #121726; color: var(--ink); padding: 5px 10px; }
    .hud button { cursor: pointer; } .hud button:hover { border-color: var(--gold); }
    .hud button:focus-visible, .hud input:focus-visible { outline: 2px solid var(--gold); outline-offset: 1px; }
    .hud input { width: 130px; }
    #tip { position: fixed; pointer-events: none; background: var(--panel); border: 1px solid var(--gold);
        border-radius: 10px; padding: 8px 11px; font-size: 0.85em; display: none; min-width: 170px; }
    #tip b { color: var(--gold); }
    #tip small { color: var(--muted); display: block; }
    .lbl { color: var(--ink); font-weight: 700; font-size: 12px; text-shadow: 0 1px 3px #000, 0 0 8px #000;
        white-space: nowrap; padding: 2px 6px; border-radius: 6px; background: rgba(7,10,18,0.55); }
    .lbl.me { color: var(--gold); font-size: 15px; border: 1px solid var(--gold); }
    .lv { font: 700 11px/1 'Segoe UI', system-ui, sans-serif; color: #fff; padding: 3px 6px; border-radius: 999px;
        background: rgba(7,10,18,0.78); border: 1.5px solid var(--bc); text-shadow: 0 1px 2px #000; white-space: nowrap; }
    #tip .tlv { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 10px; margin: 6px 0 2px; }
    #tip .tlv span { color: var(--muted); border-left: 3px solid var(--bc); padding-left: 5px; font-size: 0.92em; }
    #tip .tlv b { color: var(--ink); }
    .lbl.p1 { color: #f2c230; } .lbl.p2 { color: #c9d1dc; } .lbl.p3 { color: #d08a4a; }
    #load { position: fixed; inset: 0; display: grid; place-items: center; background: var(--bg); color: var(--muted); z-index: 5; transition: opacity .5s; }
</style>
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="view"></canvas>
<div class="hud">
    <h1>Outpost World</h1>
    <p id="hud-sub">Reading the season…</p>
    <div class="row">
        <input id="wal" placeholder="wallet" aria-label="Wallet to centre on">
        <button id="go">Centre</button>
        <button id="home" title="Fly back to your base">Home</button>
        <button id="spin" aria-pressed="true">Orbit: on</button>
    </div>
</div>
<div id="tip"></div>
<div id="load">Reading the Mission Control season…</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ── layout constants (world units) ── */
const PLOT = 36;          // spacing between base centres (one grid cell)
const SLOT = 10;          // spacing between the 3x3 buildings inside a base
const BLD = 2.6;          // a building's footprint
const ME_SCALE = 2.5;     // the viewer's base
const NEAR_N = 60;        // bases drawn with real models; the rest as blocks

// building ids → grid slot (from the 2D builder's B_MAP) and colour
const B = {
    market:    { name: 'Spaceport',        col: '#9333ea', x: 0, y: 0 },
    prodone:   { name: 'Lumber Mill',      col: '#b45309', x: 1, y: 0 },
    prodtwo:   { name: 'Foundry',          col: '#dc2626', x: 2, y: 0 },
    prodthree: { name: 'Laboratory',       col: '#2563eb', x: 0, y: 1 },
    faucet:    { name: 'Exploder',         col: '#f59e0b', x: 1, y: 1 },
    prodfour:  { name: 'Refinery',         col: '#ea580c', x: 2, y: 1 },
    prodfive:  { name: 'Upcycling Center', col: '#16a34a', x: 0, y: 2 },
    prodsix:   { name: 'Hunting Cabin',    col: '#0d9488', x: 1, y: 2 },
    storage:   { name: 'Storage',          col: '#475569', x: 2, y: 2 }
};
/* A building's look follows its level: rank 1 for levels 0-4, rank 2 for 5-14, rank 3 for
   15-24, rank 4 for 25+. Files are mcob/<id>-hi.glb for rank 1 and mcob/<id>-r<rank>-hi.glb
   above it (plus -lo copies). A rank without a model yet uses the highest rank below it that
   has one. */
const MODEL_RANKS = { prodone: [1], prodtwo: [1], prodthree: [1, 2, 3, 4], prodfour: [1], prodfive: [1] };
const rankOfLevel = lvl => lvl >= 25 ? 4 : lvl >= 15 ? 3 : lvl >= 5 ? 2 : 1;
function modelRank(id, lvl) {
    const have = MODEL_RANKS[id] || [], want = rankOfLevel(lvl);
    let best = have[0];
    have.forEach(k => { if (k <= want && k > best) best = k; });
    return best;
}
const DIR = 'mcob/';
const fileKey = (id, rank) => rank > 1 ? id + '-r' + rank : id;
// per-model turn, baked into the model so its square base lines up with the grid
// (degrees, anticlockwise seen from above), keyed by file
const MODEL_YAW = { prodone: 17 };
const RPC = ['https://wax.greymass.com', 'https://api.wax.alohaeos.com', 'https://wax.eosusa.io'];

/* ── chain ── */
async function rpc(body) {
    for (const u of RPC) {
        try {
            const r = await fetch(u + '/v1/chain/get_table_rows', { method: 'POST', body: JSON.stringify(body) });
            if (r.ok) return await r.json();
        } catch (e) {}
    }
    throw new Error('chain unreachable');
}
async function season() {
    let rows = [], lower = '';
    for (let i = 0; i < 40; i++) {
        const d = await rpc({ json: true, code: 'game.mc', scope: 'game.mc', table: 'players', limit: 500, lower_bound: lower || undefined });
        rows = rows.concat(d.rows || []);
        if (!d.more) break;
        lower = d.next_key;
    }
    return rows;
}
const fmt = n => { n = Number(n) || 0; return n >= 1e9 ? (n / 1e9).toFixed(2) + 'B' : n >= 1e6 ? (n / 1e6).toFixed(2) + 'M' : n >= 1e3 ? (n / 1e3).toFixed(1) + 'k' : String(Math.floor(n)); };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* ── scene ── */
const canvas = document.getElementById('view');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
const scene = new THREE.Scene();
scene.background = new THREE.Color('#070a12');
scene.fog = new THREE.Fog('#070a12', 450, 1400);
const cam = new THREE.PerspectiveCamera(45, 1, 0.5, 4000);
cam.position.set(60, 55, 60);
const labels = new CSS2DRenderer();
labels.domElement.style.cssText = 'position:fixed;inset:0;pointer-events:none';
document.body.appendChild(labels.domElement);
const controls = new OrbitControls(cam, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.maxPolarAngle = Math.PI * 0.47; controls.minDistance = 20; controls.maxDistance = 1100;
controls.autoRotate = true; controls.autoRotateSpeed = 0.5;

// soft reflections, so the generated models' metal surfaces read as metal instead of black
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.55;
scene.add(new THREE.HemisphereLight('#9fb6ff', '#1a1208', 1.1));
const sun = new THREE.DirectionalLight('#fff1d6', 2.2); sun.position.set(80, 140, 40); scene.add(sun);
const ground = new THREE.Mesh(new THREE.CircleGeometry(4000, 64), new THREE.MeshStandardMaterial({ color: '#0c111c', roughness: 1 }));
ground.rotation.x = -Math.PI / 2; scene.add(ground);
const grid = new THREE.GridHelper(PLOT * 100, 100, '#1e2a40', '#121a2a'); grid.position.set(PLOT / 2, 0.02, PLOT / 2); scene.add(grid);   // one cell per plot, bases centred in them

function size() {
    const w = innerWidth, h = innerHeight;
    renderer.setSize(w, h, false); labels.setSize(w, h);
    cam.aspect = w / h; cam.updateProjectionMatrix();
}
addEventListener('resize', size); size();

/* ── models ── */
const loader = new GLTFLoader();
async function model(file) {
    const g = await loader.loadAsync(file);
    let mesh = null; g.scene.traverse(o => { if (o.isMesh && !mesh) mesh = o; });
    const box = new THREE.Box3().setFromBufferAttribute(mesh.geometry.attributes.position);
    const w = Math.max(box.max.x - box.min.x, box.max.z - box.min.z);
    const mat = mesh.material;
    mat.metalness = Math.min(mat.metalness ?? 0, 0.35); mat.roughness = Math.max(mat.roughness ?? 1, 0.55);
    return { geo: mesh.geometry, mat, unit: 1.35 / w };   // unit: scale that makes it a bit over 1 wide
}

/* ── base floor: a steel deck with walkways ──
   Drawn once on a canvas and stretched over every base's pad, tinted per base (gold for
   yours). The canvas maps straight onto the pad: x across, y = world z, so the nine
   building spots sit at 0.5 +/- SPOT of its width. Each spot gets a landing pad, and
   meandering walkways link neighbours and run out to an entrance on the south edge. */
const SPOT = 0.324;   // SLOT / pad width (10 / 31.2 at 1x, 25 / 76.2 at 2.5x)
function steelTexture() {
    const N = 1024, c = document.createElement('canvas'); c.width = c.height = N;
    const g = c.getContext('2d');
    let seed = 7;   // same pattern every load
    const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
    g.fillStyle = '#9aa1ab'; g.fillRect(0, 0, N, N);
    // grime and brushed streaks
    for (let i = 0; i < 6000; i++) {
        const v = 120 + rnd() * 60 | 0;
        g.fillStyle = 'rgba(' + v + ',' + (v + 4) + ',' + (v + 10) + ',' + (0.05 + rnd() * 0.08) + ')';
        g.fillRect(rnd() * N, rnd() * N, 3 + rnd() * 50, 1 + rnd() * 3);
    }
    // diamond tread
    g.strokeStyle = 'rgba(255,255,255,0.16)'; g.lineWidth = 2.5;
    for (let y = 10; y < N; y += 24) for (let x = (y / 24 % 2) * 12 + 8; x < N; x += 24) {
        g.beginPath(); g.moveTo(x, y + 5); g.lineTo(x + 8, y - 3); g.stroke();
    }
    // faint plate seams on thirds, between the building rows
    g.strokeStyle = 'rgba(20,24,30,0.35)'; g.lineWidth = 4;
    [1, 2].forEach(k => { const q = k * N / 3; g.beginPath(); g.moveTo(q, 0); g.lineTo(q, N); g.stroke(); g.beginPath(); g.moveTo(0, q); g.lineTo(N, q); g.stroke(); });

    const at = i => N * (0.5 + (i - 1) * SPOT);   // spot 0/1/2 -> pixels
    // a walkway from p to q that wanders side to side
    const walk = (p, q, wide) => {
        const dx = q[0] - p[0], dy = q[1] - p[1], len = Math.hypot(dx, dy), nx = -dy / len, ny = dx / len;
        const amp = len * (0.07 + rnd() * 0.06), waves = 1 + (rnd() * 2 | 0), ph = rnd() * Math.PI;
        const pts = [];
        for (let k = 0; k <= 40; k++) {
            const t = k / 40, w = Math.sin(t * Math.PI) * amp * Math.sin(t * Math.PI * waves + ph);
            pts.push([p[0] + dx * t + nx * w, p[1] + dy * t + ny * w]);
        }
        const line = (width, style, dash) => {
            g.setLineDash(dash || []); g.lineWidth = width; g.strokeStyle = style; g.lineCap = 'round'; g.lineJoin = 'round';
            g.beginPath(); pts.forEach((v, k) => k ? g.lineTo(v[0], v[1]) : g.moveTo(v[0], v[1])); g.stroke();
        };
        line(wide + 10, 'rgba(255,255,255,0.10)');        // worn edge
        line(wide, 'rgba(58,63,72,0.92)');               // the path
        line(wide - 14, 'rgba(78,84,94,0.9)');            // its middle, scuffed lighter
        line(3, 'rgba(232,170,60,0.55)', [18, 16]);       // guide line
        g.setLineDash([]);
    };
    // neighbours along rows and columns, plus the south entrance
    for (let y = 0; y < 3; y++) for (let x = 0; x < 2; x++) walk([at(x), at(y)], [at(x + 1), at(y)], 46);
    for (let x = 0; x < 3; x++) for (let y = 0; y < 2; y++) walk([at(x), at(y)], [at(x), at(y + 1)], 46);
    walk([at(1), at(2)], [N * 0.5, N - 4], 54);
    // landing pads under the buildings, with a hazard border: round for the middle row
    // (Laboratory, Exploder, Refinery), square for the six around them
    for (let y = 0; y < 3; y++) for (let x = 0; x < 3; x++) {
        const cx = at(x), cy = at(y), R = N * 0.085;
        if (y !== 1) {
            const o = R + 10, b = 10;   // outer half-size, border width
            g.save();
            g.beginPath(); g.rect(cx - o, cy - o, 2 * o, 2 * o); g.rect(cx - o + b, cy - o + b, 2 * (o - b), 2 * (o - b)); g.clip('evenodd');
            g.fillStyle = 'rgba(232,170,60,0.85)'; g.fillRect(cx - o, cy - o, 2 * o, 2 * o);
            g.strokeStyle = 'rgba(30,32,38,0.9)'; g.lineWidth = 9;
            for (let d = -2 * o; d < 2 * o; d += 22) { g.beginPath(); g.moveTo(cx - o + d, cy + o); g.lineTo(cx - o + d + 2 * o, cy - o); g.stroke(); }
            g.restore();
            g.fillStyle = 'rgba(110,117,128,0.95)'; g.fillRect(cx - o + b, cy - o + b, 2 * (o - b), 2 * (o - b));
            g.strokeStyle = 'rgba(255,255,255,0.18)'; g.lineWidth = 2; g.strokeRect(cx - R * 0.72, cy - R * 0.72, R * 1.44, R * 1.44);
            continue;
        }
        g.fillStyle = 'rgba(40,44,52,0.95)'; g.beginPath(); g.arc(cx, cy, R + 10, 0, 7); g.fill();
        for (let k = 0; k < 24; k++) {
            g.fillStyle = k % 2 ? 'rgba(232,170,60,0.85)' : 'rgba(30,32,38,0.9)';
            g.beginPath(); g.arc(cx, cy, R + 8, k / 24 * 2 * Math.PI, (k + 1) / 24 * 2 * Math.PI);
            g.arc(cx, cy, R, (k + 1) / 24 * 2 * Math.PI, k / 24 * 2 * Math.PI, true); g.fill();
        }
        g.fillStyle = 'rgba(110,117,128,0.95)'; g.beginPath(); g.arc(cx, cy, R, 0, 7); g.fill();
        g.strokeStyle = 'rgba(255,255,255,0.18)'; g.lineWidth = 2; g.beginPath(); g.arc(cx, cy, R * 0.72, 0, 7); g.stroke();
    }
    // rim rivets
    for (let k = 0; k < 16; k++) [[k / 16 * N + 32, 14], [k / 16 * N + 32, N - 14], [14, k / 16 * N + 32], [N - 14, k / 16 * N + 32]].forEach(([x, y]) => {
        g.fillStyle = '#5c636d'; g.beginPath(); g.arc(x, y, 6, 0, 7); g.fill();
        g.fillStyle = 'rgba(255,255,255,0.45)'; g.beginPath(); g.arc(x - 2, y - 2, 2.5, 0, 7); g.fill();
    });
    const t = new THREE.CanvasTexture(c);
    t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
    return t;
}

/* ── world ── */
let BASES = [], ME = null;
const pads = { mesh: null }, tmp = new THREE.Object3D(), col = new THREE.Color();

function layout(rows, me) {
    const key = r => Number(r.gamecurrency_per_minute) || 0;
    const ranked = rows.slice().sort((a, b) => key(b) - key(a));
    ranked.forEach((r, i) => r._rank = i + 1);
    const meRow = rows.find(r => r.wallet === me) || ranked[0];
    // the middle is the viewer; the podium sits just north of it; everyone else on rings, best rank nearest
    meRow._x = 0; meRow._z = 0; meRow._s = ME_SCALE;
    const spots = [];
    for (let i = -40; i <= 40; i++) for (let j = -40; j <= 40; j++) {
        const x = i * PLOT, z = j * PLOT, d = Math.hypot(x, z);
        if (d < PLOT * 2.2) continue;                                   // clear ring round the big base
        if (z < -PLOT * 1.5 && z > -PLOT * 4.5 && Math.abs(x) < PLOT * 2.5) continue;   // podium plaza
        spots.push([x, z, d]);
    }
    spots.sort((a, b) => a[2] - b[2]);
    let k = 0, pod = 0;
    ranked.forEach(r => {
        r._s = r === meRow ? ME_SCALE : 1;
        if (r !== meRow && r._rank <= 3) {
            r._pod = r._rank; pod++;
            r._x = [0, -PLOT * 1.6, PLOT * 1.6][r._rank - 1]; r._z = -PLOT * 3;
            return;
        }
        if (r === meRow) { r._pod = r._rank <= 3 ? r._rank : 0; return; }
        const s = spots[k++]; r._x = s[0]; r._z = s[1];
    });
    return { ranked, meRow };
}
const PODH = { 1: 5, 2: 3.4, 3: 2.2 }, PODC = { 1: '#f2c230', 2: '#c9d1dc', 3: '#d08a4a' };
const lift = r => (r._pod && r._s === 1 ? PODH[r._pod] : 0);

// every building of every base, as a transform
function buildingMatrix(r, b, m4) {
    const def = B[b.buildingid]; if (!def) return false;
    const lvl = Number(b.building_level) || 1;
    const s = r._s * BLD * (0.75 + Math.min(lvl, 40) / 100);
    tmp.position.set(r._x + (def.x - 1) * SLOT * r._s, lift(r), r._z + (def.y - 1) * SLOT * r._s);
    tmp.rotation.set(0, Math.PI / 2, 0);   // square to the grid, turned 90 degrees left
    tmp.scale.set(s, s, s);
    tmp.updateMatrix(); m4.copy(tmp.matrix);
    return true;
}

async function build(rows, me) {
    const { ranked, meRow } = layout(rows, me);
    BASES = ranked; ME = meRow;

    // pads: one per base, gold for yours
    const padGeo = new THREE.BoxGeometry(1, 0.4, 1);
    const padMat = new THREE.MeshStandardMaterial({ map: steelTexture(), roughness: 0.55, metalness: 0.6 });
    pads.mesh = new THREE.InstancedMesh(padGeo, padMat, BASES.length);
    BASES.forEach((r, i) => {
        const w = 3 * SLOT * r._s + 1.2;
        tmp.position.set(r._x, lift(r) + 0.2, r._z); tmp.rotation.set(0, 0, 0); tmp.scale.set(w, 1, w); tmp.updateMatrix();
        pads.mesh.setMatrixAt(i, tmp.matrix);
        pads.mesh.setColorAt(i, col.set(r === ME ? '#d9a84e' : r._rank <= 10 ? '#8e9cb8' : r._rank <= 50 ? '#7a8496' : '#666e7c'));   // tints over the steel
    });
    scene.add(pads.mesh);

    // podiums
    BASES.filter(r => r._pod && r._s === 1).forEach(r => {
        const w = 3 * SLOT + 2, h = PODH[r._pod];
        const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, w), new THREE.MeshStandardMaterial({ color: PODC[r._pod], metalness: 0.55, roughness: 0.35 }));
        m.position.set(r._x, h / 2, r._z); scene.add(m);
    });

    // buildings without a model yet: simple shapes in the building's colour (instanced per type)
    const simple = {};
    const shape = new THREE.CylinderGeometry(0.42, 0.5, 0.8, 8); shape.translate(0, 0.4, 0);
    Object.keys(B).forEach(id => {
        if (MODEL_RANKS[id]) return;
        const list = [];
        BASES.forEach(r => (r.buildings || []).forEach(b => { if (b.buildingid === id) list.push([r, b]); }));
        const im = new THREE.InstancedMesh(shape, new THREE.MeshStandardMaterial({ color: B[id].col, roughness: 0.55, metalness: 0.3 }), list.length);
        const m4 = new THREE.Matrix4();
        list.forEach(([r, b], i) => { buildingMatrix(r, b, m4); im.setMatrixAt(i, m4); });
        scene.add(im); simple[id] = im;
    });

    // modelled buildings: your base in full detail; the NEAR_N bases nearest the camera's focus
    // in the lighter model; all the rest as blocks. Re-chosen as the camera moves.
    const block = new THREE.BoxGeometry(0.8, 0.8, 0.8); block.translate(0, 0.4, 0);
    LOD.types = [];
    for (const [id, rank] of Object.entries(MODEL_RANKS).flatMap(([id, rs]) => rs.map(k => [id, k]))) {
        const key = fileKey(id, rank);
        const [hi, lo] = await Promise.all([model(DIR + key + '-hi.glb'), model(DIR + key + '-lo.glb')]);
        if (MODEL_YAW[key]) { const a = MODEL_YAW[key] * Math.PI / 180; hi.geo.rotateY(a); if (lo.geo !== hi.geo) lo.geo.rotateY(a); }
        const list = [];
        BASES.forEach(r => (r.buildings || []).forEach(b => {
            if (b.buildingid === id && modelRank(id, Number(b.building_level) || 0) === rank) list.push([r, b]);
        }));
        const mine = list.find(([r]) => r === ME);
        if (mine) {
            const m = new THREE.Mesh(hi.geo, hi.mat), m4 = new THREE.Matrix4();
            buildingMatrix(mine[0], mine[1], m4); m.applyMatrix4(m4); m.scale.multiplyScalar(hi.unit); scene.add(m);
        }
        const others = list.filter(([r]) => r !== ME);
        const near = new THREE.InstancedMesh(lo.geo, lo.mat, others.length);
        const far = new THREE.InstancedMesh(block, new THREE.MeshStandardMaterial({ color: B[id].col, roughness: 0.6 }), others.length);
        near.frustumCulled = far.frustumCulled = false;
        scene.add(near, far);
        LOD.types.push({ id, unit: lo.unit, others, near, far });
    }
    LOD.update(true);

    // labels: you and the podium
    const tag = (r, cls, text) => {
        const el = document.createElement('div'); el.className = 'lbl ' + cls; el.textContent = text;
        const o = new CSS2DObject(el); o.position.set(r._x, lift(r) + (r._s > 1 ? 30 : 9), r._z); scene.add(o);
    };
    tag(ME, 'me', 'You · ' + (ME.gamertag || ME.wallet) + ' · #' + ME._rank);
    levelTags(ME, scene);
    BASES.filter(r => r._pod && r !== ME).forEach(r => tag(r, 'p' + r._pod, '#' + r._rank + ' ' + (r.gamertag || r.wallet)));

    document.getElementById('hud-sub').textContent = BASES.length + ' bases this season · you are #' + ME._rank + ' by Я/min';
    flyTo(ME, true);
}

const LOD = {
    types: [], last: 0,
    update(force) {
        const now = performance.now();
        if (!force && now - this.last < 250) return;
        this.last = now;
        const t = controls.target;
        // the NEAR_N bases closest to where the camera is looking get models
        const near = new Set(BASES.filter(r => r !== ME).map(r => [r, Math.hypot(r._x - t.x, r._z - t.z)])
            .sort((a, b) => a[1] - b[1]).slice(0, NEAR_N).map(x => x[0]));
        const m4 = new THREE.Matrix4(), sc = new THREE.Matrix4();
        this.types.forEach(T => {
            let n = 0, f = 0;
            sc.makeScale(T.unit, T.unit, T.unit);
            T.others.forEach(([r, b]) => {
                buildingMatrix(r, b, m4);
                if (near.has(r)) T.near.setMatrixAt(n++, m4.clone().multiply(sc));
                else T.far.setMatrixAt(f++, m4);
            });
            T.near.count = n; T.far.count = f;
            T.near.instanceMatrix.needsUpdate = T.far.instanceMatrix.needsUpdate = true;
        });
    }
};

/* ── level tags: always over your base, and over whichever base the pointer is on ── */
function levelTags(r, parent) {
    (r.buildings || []).forEach(b => {
        const def = B[b.buildingid]; if (!def) return;
        const lvl = Number(b.building_level) || 0;
        const el = document.createElement('div'); el.className = 'lv';
        el.style.setProperty('--bc', def.col);
        el.textContent = 'Lv ' + lvl;
        el.title = def.name + ', level ' + lvl;
        const o = new CSS2DObject(el);
        o.position.set(r._x + (def.x - 1) * SLOT * r._s, lift(r) + 3.2 * r._s, r._z + (def.y - 1) * SLOT * r._s);
        parent.add(o);
    });
}
const hoverTags = new THREE.Group(); scene.add(hoverTags);
let hoverBase = null;
function showHoverTags(r) {
    if (r === hoverBase) return;
    hoverBase = r;
    hoverTags.children.slice().forEach(o => { if (o.element) o.element.remove(); hoverTags.remove(o); });
    if (r && r !== ME) levelTags(r, hoverTags);
}

/* ── camera moves ── */
let fly = null, idleAt = 0;
function flyTo(r, instant) {
    const to = new THREE.Vector3(r._x, lift(r), r._z);
    const dist = r._s > 1 ? 150 : 70;
    const dir = cam.position.clone().sub(controls.target).normalize();
    const pos = to.clone().add(dir.multiplyScalar(dist)); pos.y = Math.max(pos.y, to.y + dist * 0.6);
    if (instant || matchMedia('(prefers-reduced-motion: reduce)').matches) { controls.target.copy(to); cam.position.copy(pos); LOD.update(true); return; }
    fly = { t: 0, a: controls.target.clone(), b: to, pa: cam.position.clone(), pb: pos };
}
controls.addEventListener('start', () => { controls.autoRotate = false; fly = null; });
controls.addEventListener('end', () => { idleAt = performance.now(); });

/* ── picking ── */
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2(), tip = document.getElementById('tip');
function pick(e) {
    ptr.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
    ray.setFromCamera(ptr, cam);
    const hit = pads.mesh && ray.intersectObject(pads.mesh)[0];
    return hit ? BASES[hit.instanceId] : null;
}
renderer.domElement.addEventListener('pointermove', e => {
    const r = pick(e);
    showHoverTags(r);
    if (!r) { tip.style.display = 'none'; return; }
    tip.innerHTML = '<b>#' + r._rank + ' ' + esc(r.gamertag || r.wallet) + '</b><small>' + esc(r.wallet) + '</small>' +
        fmt(r.gamecurrency_per_minute) + ' \u042f/min' +
        '<span class="tlv">' + (r.buildings || []).filter(b => B[b.buildingid])
            .sort((a, b) => (B[a.buildingid].y * 3 + B[a.buildingid].x) - (B[b.buildingid].y * 3 + B[b.buildingid].x))
            .map(b => '<span style="--bc:' + B[b.buildingid].col + '">' + esc(B[b.buildingid].name) + ' <b>' + (Number(b.building_level) || 0) + '</b></span>').join('') + '</span>' +
        '<small>Double-click to fly here</small>';
    tip.style.display = 'block';
    tip.style.left = Math.min(e.clientX + 16, innerWidth - 300) + 'px'; tip.style.top = (e.clientY + 14) + 'px';
});
renderer.domElement.addEventListener('dblclick', e => { const r = pick(e); if (r) { controls.autoRotate = false; flyTo(r); } });

/* ── HUD ── */
const spinBtn = document.getElementById('spin');
const setSpin = on => { controls.autoRotate = on; spinBtn.textContent = 'Orbit: ' + (on ? 'on' : 'off'); spinBtn.setAttribute('aria-pressed', on); };
spinBtn.onclick = () => { idleAt = 0; setSpin(!controls.autoRotate); };
document.getElementById('home').onclick = () => ME && flyTo(ME);
document.getElementById('go').onclick = () => {
    const w = document.getElementById('wal').value.trim(); if (!w) return;
    const u = new URL(location.href); u.searchParams.set('wallet', w); location.href = u;
};

/* ── loop ── */
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
    const dt = clock.getDelta();
    if (fly) {
        fly.t = Math.min(1, fly.t + dt / 1.4);
        const k = fly.t < 0.5 ? 2 * fly.t * fly.t : 1 - Math.pow(-2 * fly.t + 2, 2) / 2;
        controls.target.lerpVectors(fly.a, fly.b, k); cam.position.lerpVectors(fly.pa, fly.pb, k);
        if (fly.t >= 1) { fly = null; idleAt = performance.now(); }
    }
    // resume the slow orbit 10 s after the last touch, if it was on
    if (!controls.autoRotate && idleAt && performance.now() - idleAt > 10000 && spinBtn.getAttribute('aria-pressed') === 'true') { controls.autoRotate = true; idleAt = 0; }
    controls.update();
    LOD.update();
    renderer.render(scene, cam); labels.render(scene, cam);
});

/* ── start ── */
(async () => {
    const q = new URLSearchParams(location.search).get('wallet');
    let me = q || '';
    try { me = me || localStorage.getItem('naron_wallet') || ''; } catch (e) {}
    document.getElementById('wal').value = me;
    try {
        const rows = await season();
        await build(rows, me);
        if (!rows.some(r => r.wallet === me)) document.getElementById('hud-sub').textContent += ' (no base for that wallet; centred on #1)';
    } catch (e) {
        document.getElementById('load').textContent = 'Could not load: ' + e.message;
        return;
    }
    const ld = document.getElementById('load'); ld.style.opacity = 0; setTimeout(() => ld.remove(), 600);
})();
</script>
</body>
