<script>
'use strict';

/* ── DATA ────────────────────────────────────────────────────────────────────
   Players buy gems by sending WAX to shop.ale with a "purchase,<pack>" memo.
   shop.ale forwards the lot to collect.ale, which splits it onward.

   IMPORTANT — endpoint choice. Most WAX Hyperion nodes only backfill a few
   weeks and answer happily with a partial result, which silently understates
   every total here: wax.eosusa.io returns collect.ale only from 3 Sep 2026 and
   api.waxsweden.org only from 26 Aug, against a true first transfer in Mar 2026.
   history.waxsweden.org carries the full range, so it is tried first and every
   pull is checked against the node's own tracked total before it is drawn. */
const HISTORY = ['https://history.waxsweden.org', 'https://wax.eosusa.io', 'https://api.waxsweden.org'];
const SHOP = 'shop.ale', COLLECT = 'collect.ale';
const POOLS = 'pools.ale', CPU = 'cpu.ale', RAM = 'ram.ale';
const LEGS = [SHOP, COLLECT, POOLS, CPU, RAM];

let _ep = null;

// A page that times out must not end the walk — dropping one page silently
// truncates the history and understates every total, so each page is retried
// on the same node before the next one is tried at all.
async function hGet(path) {
    const eps = _ep ? [_ep].concat(HISTORY.filter(e => e !== _ep)) : HISTORY;
    for (const ep of eps) {
        for (let attempt = 0; attempt < 3; attempt++) {
            try {
                const r = await fetch(ep + path, { signal: AbortSignal.timeout(25000) });
                if (r.ok) { _ep = ep; return await r.json(); }
            } catch (_) { /* retry */ }
            await new Promise(r => setTimeout(r, 400 * (attempt + 1)));
        }
    }
    return null;
}

const Q = encodeURIComponent('eosio.token:transfer');

async function transfersOf(account) {
    const out = [];
    let before = '', truncated = false;
    for (let page = 0; page < 40; page++) {
        const d = await hGet('/v2/history/get_actions?account=' + account + '&filter=' + Q +
            '&limit=1000&sort=desc' + (before ? '&before=' + encodeURIComponent(before) : ''));
        if (!d) { truncated = true; break; }           // a lost page, not the end of history
        const acts = d.actions || [];
        if (!acts.length) break;
        for (const a of acts) out.push(Object.assign({ ms: Date.parse(a.timestamp + 'Z') }, a.act.data));
        if (acts.length < 1000) break;
        before = acts[acts.length - 1].timestamp;   // inclusive, so pages overlap by one
    }
    // that overlap means the last row of a page repeats as the first of the next
    const seen = new Set();
    const rows = out.filter(t => {
        const k = t.ms + '|' + t.from + '|' + t.to + '|' + t.quantity + '|' + t.memo;
        if (seen.has(k)) return false;
        seen.add(k);
        return true;
    });
    rows.truncated = truncated;
    return rows;
}

async function trackedTotal(account) {
    const d = await hGet('/v2/history/get_actions?account=' + account + '&filter=' + Q +
        '&limit=1&track=true');
    return (d && d.total && d.total.value) || 0;
}

const amt = q => parseFloat(q) || 0;
const sum = rows => rows.reduce((t, r) => t + amt(r.quantity), 0);
const fmt = n => Math.round(n).toLocaleString();
const fmt1 = n => n.toLocaleString(undefined, { maximumFractionDigits: 1 });

/* ── TOOLTIP ─────────────────────────────────────────────────────────────── */
const tip = document.getElementById('tip');
function showTip(e, html) {
    tip.innerHTML = html;
    tip.style.opacity = '1';
    const pad = 14, w = tip.offsetWidth, h = tip.offsetHeight;
    let x = e.clientX + pad, y = e.clientY + pad;
    if (x + w > innerWidth - 8) x = e.clientX - w - pad;
    if (y + h > innerHeight - 8) y = e.clientY - h - pad;
    tip.style.left = x + 'px';
    tip.style.top = y + 'px';
}
function hideTip() { tip.style.opacity = '0'; }

function bindTip(el, html) {
    el.addEventListener('mousemove', e => showTip(e, html));
    el.addEventListener('mouseleave', hideTip);
}

/* ── FLOW DIAGRAM ────────────────────────────────────────────────────────────
   A Sankey is the right form here: the question is where a single pot of money
   travels, and the ribbon width carries the amount at every stage. */
function drawFlow(cols, links, total) {
    // the last column labels sit outside their node, so the columns are laid out
    // in a narrower band and the remainder is left for that text
    const W = 1160, colW = 122, rowGap = 8, padY = 20, labelSpace = 205;
    const nCols = cols.length;
    const gap = (W - labelSpace - colW * nCols) / (nCols - 1);
    const colX = cols.map((_, i) => i * (colW + gap));
    const tallest = Math.max.apply(null, cols.map(c =>
        c.reduce((t, n) => t + n.wax, 0) + rowGap * Math.max(0, c.length - 1)));
    const H = 420;
    const usable = H - padY * 2;
    const maxRows = Math.max.apply(null, cols.map(c => c.length));
    const scale = v => Math.max(2.5, v / total * (usable - rowGap * (maxRows - 1)));

    const place = (items, x) => {
        let y = padY;
        const out = items.map(it => {
            const h = scale(it.wax);
            const node = Object.assign({ x: x, y: y, h: h, inY: y, outY: y }, it);
            y += h + rowGap;
            return node;
        });
        const shift = (H - (y - rowGap)) / 2;
        out.forEach(o => { o.y += shift; o.inY += shift; o.outY += shift; });
        return out;
    };
    const placed = cols.map((c, i) => place(c, colX[i]));
    const byId = {};
    placed.forEach(col => col.forEach(n => byId[n.id] = n));

    let svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Full cycle of gem revenue">';

    links.forEach(l => {
        const from = byId[l.from], to = byId[l.to];
        if (!from || !to || !l.wax) return;
        const h = scale(l.wax);
        const x0 = from.x + colW, x1 = to.x, mid = (x0 + x1) / 2;
        const y0 = from.outY, y1 = to.inY;
        from.outY += h;
        to.inY += h;
        svg += '<path class="flow" d="M' + x0 + ' ' + y0 + ' C' + mid + ' ' + y0 + ',' + mid + ' ' + y1 +
            ',' + x1 + ' ' + y1 + ' L' + x1 + ' ' + (y1 + h) + ' C' + mid + ' ' + (y1 + h) + ',' +
            mid + ' ' + (y0 + h) + ',' + x0 + ' ' + (y0 + h) + ' Z" fill="' + (l.color || to.color) +
            '" opacity="0.3" data-tip="' + from.name + ' &rarr; ' + to.name + '<br><b>' +
            fmt(l.wax) + ' WAX</b>"></path>';
    });

    placed.forEach((col, ci) => {
        let lastLabelY = -1e9;
        const last = ci === nCols - 1;
        col.forEach(n => {
            svg += '<rect class="flow" x="' + n.x + '" y="' + n.y + '" width="' + colW + '" height="' + n.h +
                '" fill="' + n.color + '" rx="2" data-tip="<b>' + n.name + '</b><br>' + fmt(n.wax) +
                ' WAX' + (n.sub ? '<br>' + n.sub : '') + '"></rect>';
            const centre = n.y + n.h / 2;
            const ty = Math.max(centre, lastLabelY + 39);   // two lines plus air
            lastLabelY = ty;
            const tx = (last || n.h < 26) ? n.x + colW + 9 : n.x + 6;
            if (Math.abs(ty - centre) > 3) {
                const outside = last || n.h < 26;
                const lx = outside ? n.x + colW : n.x;
                svg += '<path d="M' + lx + ' ' + centre + ' L' + (outside ? tx - 4 : tx) + ' ' + ty +
                    '" stroke="' + n.color + '" stroke-width="1" fill="none" opacity="0.5"/>';
            }
            const ink = n.lightFill ? '#1a1206' : '#fff';
            const inkSub = n.lightFill ? 'rgba(26,18,6,0.88)' : 'var(--muted)';
            svg += '<text class="node-label" x="' + tx + '" y="' + (ty - 3) + '" fill="' + ink + '">' +
                n.name + '</text>';
            svg += '<text class="node-sub" x="' + tx + '" y="' + (ty + 12) + '" fill="' + inkSub + '">' +
                fmt(n.wax) + ' WAX' + (n.pct != null ? ' · ' + fmt1(n.pct) + '%' : '') + '</text>';
        });
    });
    svg += '</svg>';
    return svg;
}

/* ── WEEKLY SPLIT ────────────────────────────────────────────────────────────
   Stacked by where each payment went, so the shape of the operation is legible:
   a steady pools band under occasional development spikes. Stacked because the
   question is composition over time; segments carry a 2px surface gap so the
   boundary is a gap rather than a hairline that could read as data. */
const WEEK_CATS = [
    { name: 'Development',      color: 'var(--series-2)', match: a => a === '5thba.wam' || a === '42lra.wam' },
    { name: 'Reward pools',     color: 'var(--series-3)', match: a => a === 'pools.ale' },
    { name: 'Player resources', color: 'var(--series-1)', match: a => a === 'cpu.ale' || a === 'ram.ale' },
    { name: 'Other',            color: 'var(--muted)',    match: () => true }
];

function drawWeekly(weeks, maxV) {
    if (!weeks.length) return '<p class="note">No payments on record.</p>';
    const W = 1000, H = 275, PL = 74, PR = 16, PT = 22, PB = 58;
    const iw = W - PL - PR, ih = H - PT - PB;
    const step = iw / weeks.length;
    const bw = Math.max(3, Math.min(30, step * 0.66));

    let svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Payments out of collect.ale by week">';
    [0, 0.25, 0.5, 0.75, 1].forEach(f => {
        const y = PT + ih - f * ih;
        svg += '<line class="gridline" x1="' + PL + '" y1="' + y + '" x2="' + (W - PR) + '" y2="' + y + '"/>' +
               '<text class="axis" x="' + (PL - 10) + '" y="' + (y + 4) + '" text-anchor="end">' +
               fmt(maxV * f) + '</text>';
    });

    weeks.forEach((w, i) => {
        const x = PL + (i + 0.5) * step;
        let y = PT + ih;
        WEEK_CATS.forEach(c => {
            const v = w[c.name] || 0;
            if (!v) return;
            const h = v / maxV * ih;
            const top = y - h;
            const lines = WEEK_CATS.filter(c2 => w[c2.name])
                .map(c2 => c2.name + ' ' + fmt(w[c2.name])).join('<br>');
            svg += '<rect class="flow" x="' + (x - bw / 2).toFixed(1) + '" y="' + top.toFixed(1) +
                '" width="' + bw.toFixed(1) + '" height="' + Math.max(0.5, h - 2).toFixed(1) +
                '" rx="2" fill="' + c.color + '" opacity="0.9" data-tip="<b>week of ' + w.key +
                '</b><br>' + lines + '<br>total ' + fmt(w.total) + ' WAX"></rect>';
            y = top;
        });
    });

    // every bar carries its week. At 17 weeks there is room for all of them
    // upright; past ~26 the labels are tilted rather than dropped, so no bar
    // is ever left unidentified.
    const peak = weeks.reduce((p, w, i) => w.total > weeks[p].total ? i : p, 0);
    const tilt = step < 42;
    weeks.forEach((w, i) => {
        const x = PL + (i + 0.5) * step;
        const label = w.key.slice(5);                  // MM-DD
        svg += tilt
            ? '<text class="axis" transform="translate(' + x.toFixed(1) + ',' + (H - 26) +
              ') rotate(-45)" text-anchor="end">' + label + '</text>'
            : '<text class="axis" x="' + x.toFixed(1) + '" y="' + (H - 24) +
              '" text-anchor="middle">' + label + '</text>';
        if (i === peak) {
            const py = PT + ih - (w.total / maxV * ih) - 7;
            svg += '<text class="axis" x="' + x.toFixed(1) + '" y="' + py.toFixed(1) +
                '" text-anchor="middle" fill="var(--series-2)">' + fmt(w.total) + '</text>';
        }
    });
    svg += '<text class="axis" x="' + PL + '" y="' + (H - 6) + '">week beginning</text>';
    svg += '</svg>';
    return svg;
}

/* ── BAR CHART ───────────────────────────────────────────────────────────── */
function drawMonthly(months, maxV) {
    const W = 1000, H = 230, PL = 64, PR = 14, PT = 14, PB = 40;
    const iw = W - PL - PR, ih = H - PT - PB;
    const bw = Math.min(46, iw / months.length * 0.68);
    let svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Gem revenue by month">';
    [0, 0.25, 0.5, 0.75, 1].forEach(f => {
        const y = PT + ih - f * ih;
        svg += '<line class="gridline" x1="' + PL + '" y1="' + y + '" x2="' + (W - PR) + '" y2="' + y + '"/>' +
               '<text class="axis" x="' + (PL - 8) + '" y="' + (y + 4) + '" text-anchor="end">' +
               fmt(maxV * f) + '</text>';
    });
    months.forEach((m, i) => {
        const x = PL + (i + 0.5) * (iw / months.length);
        const h = Math.max(1, m.wax / maxV * ih);
        svg += '<rect class="flow" x="' + (x - bw / 2) + '" y="' + (PT + ih - h) + '" width="' + bw +
            '" height="' + h + '" rx="4" fill="var(--series-1)" opacity="0.85" data-tip="<b>' + m.key +
            '</b><br>' + fmt(m.wax) + ' WAX<br>' + m.n + ' purchase' + (m.n === 1 ? '' : 's') + '"></rect>';
        svg += '<text class="axis" x="' + x + '" y="' + (H - 16) + '" text-anchor="middle">' +
            m.key.slice(2) + '</text>';
    });
    svg += '</svg>';
    return svg;
}

/* ── RENDER ──────────────────────────────────────────────────────────────── */
function bindAll(root) {
    root.querySelectorAll('[data-tip]').forEach(el => bindTip(el, el.getAttribute('data-tip')));
}

/* Beta opened 1 Sep 2026; everything before it is alpha. Each era is drawn on
   its own, so note that a period's payouts are not its own revenue settled:
   collect.ale is an escrow and a development draw in September can be money
   taken in weeks earlier. Totals in and out of one tab need not agree. */
const BETA_START = Date.UTC(2026, 8, 1);
let _scope = 'beta';
let _data = null;

window.setOpsScope = function (scope) {
    if (_scope === scope) return;
    _scope = scope;
    ['beta', 'alpha', 'all'].forEach(k => {
        const b = document.getElementById('tab-' + k);
        if (b) b.classList.toggle('active', k === scope);
    });
    draw();
};

function inScope(t) {
    if (_scope === 'all') return true;
    return _scope === 'beta' ? t.ms >= BETA_START : t.ms < BETA_START;
}

async function run() {
    const body = document.getElementById('body');
    try {
        const legs = await Promise.all(LEGS.map(transfersOf));
        if (!legs[0].length || !legs[1].length) throw new Error('no history returned');

        // a node that silently truncates would understate everything, so say so
        const tracked = await Promise.all(LEGS.map(trackedTotal));
        _data = {};
        LEGS.forEach((a, i) => _data[a] = legs[i]);
        _data.tracked = tracked;
        draw();
    } catch (e) {
        body.innerHTML = '<div class="err">Could not read chain history — ' +
            ((e && e.message) || e) + '</div>';
    }
}

function draw() {
    const body = document.getElementById('body');
    const shopAll = _data[SHOP], collectAll = _data[COLLECT];
    const tShop = _data.tracked[0], tCollect = _data.tracked[1];
    try {
        const short = LEGS.some((a, i) =>
            _data[a].truncated || _data[a].length < _data.tracked[i] - 2);

        const shop = shopAll.filter(inScope);
        const collect = collectAll.filter(inScope);
        const leg = a => _data[a].filter(inScope);
        // money moving between two accounts we already draw would be counted twice
        const paid = (from, to) => sum(leg(from).filter(t => t.from === from && t.to === to));
        const inflow = (acct, exclude) => sum(leg(acct).filter(t =>
            t.to === acct && t.from !== acct && t.from !== exclude));
        const outflow = (acct, exclude) => sum(leg(acct).filter(t =>
            t.from === acct && t.to !== acct && t.to !== exclude));
        const buys = shop.filter(t => t.to === SHOP && /^purchase,/.test(t.memo || ''));
        if (!buys.length) {
            body.innerHTML = tabBar() + '<div class="err">No gem purchases in this period.</div>';
            return;
        }
        const totalIn = buys.reduce((s, t) => s + amt(t.quantity), 0);
        const buyers = new Set(buys.map(t => t.from));

        const packs = {};
        buys.forEach(t => {
            const p = (t.memo || '').split(',')[1] || '(unknown)';
            const e = packs[p] || (packs[p] = { n: 0, wax: 0, buyers: new Set() });
            e.n++; e.wax += amt(t.quantity); e.buyers.add(t.from);
        });
        const packRows = Object.entries(packs).sort((a, b) => b[1].wax - a[1].wax);

        const out = {};
        collect.filter(t => t.from === COLLECT).forEach(t => {
            out[t.to] = (out[t.to] || 0) + amt(t.quantity);
        });
        const outRows = Object.entries(out).sort((a, b) => b[1] - a[1]);
        const totalOut = outRows.reduce((s, r) => s + r[1], 0);

        /* The whole cycle, not just the gem leg. Money enters at shop.ale,
           passes through collect.ale, is allocated, and then leaves the system:
           pools.ale funds the candle at recovery.ale, ram.ale buys RAM, cpu.ale
           pays powerup fees. Anything an account is still holding is drawn too,
           so every column balances against the one before it. */
        const held = (acct, skip) => Math.max(0, inflow(acct, skip) - outflow(acct, skip));

        const forwarded = paid(SHOP, COLLECT);
        const heldShop  = Math.max(0, totalIn - forwarded - sum(shop.filter(t =>
                            t.from === SHOP && t.to !== COLLECT)));
        const collectIn = sum(collect.filter(t => t.to === COLLECT));
        const carriedIn = Math.max(0, totalOut - collectIn);
        const otherIn   = Math.max(0, collectIn - forwarded);

        const toDev1  = paid(COLLECT, '5thba.wam');
        const toDev2  = paid(COLLECT, '42lra.wam');
        const toPools = paid(COLLECT, POOLS);
        const toRam   = paid(COLLECT, RAM);
        const toCpu   = paid(COLLECT, CPU);
        const heldColl = Math.max(0, collectIn + carriedIn - totalOut);

        const poolsOther = inflow(POOLS, COLLECT);
        const ramOther   = inflow(RAM, COLLECT);
        const cpuOther   = inflow(CPU, COLLECT);
        const toCandle   = paid(POOLS, 'recovery.ale');
        const ramSpent   = outflow(RAM, null);
        const cpuSpent   = outflow(CPU, null);
        const heldPools  = Math.max(0, toPools + poolsOther - toCandle);
        const heldRam    = Math.max(0, toRam + ramOther - ramSpent);
        const heldCpu    = Math.max(0, toCpu + cpuOther - cpuSpent);

        const G = 'var(--ends)';
        const node = (id, name, wax, color, sub, light) =>
            ({ id: id, name: name, wax: wax, color: color, sub: sub, lightFill: light });

        const cols = [
            [node('shop', SHOP, totalIn, 'var(--series-1)',
                  buys.length + ' purchases · ' + buyers.size + ' wallets')].concat(
              carriedIn > 0 ? [node('carried', 'Carried in from earlier', carriedIn, G,
                                    'collected before this period')] : [],
              otherIn > 0   ? [node('otherIn', 'Other funding', otherIn, G,
                                    'top-ups, not gem sales')] : []),

            [node('collect', COLLECT, collectIn + carriedIn, 'var(--series-4)',
                  'receives and allocates', true)],

            [node('dev1', '5thba.wam', toDev1, 'var(--series-2)', 'developer'),
             node('dev2', '42lra.wam', toDev2, 'var(--series-5)', 'developer'),
             node('pools', POOLS, toPools + poolsOther, 'var(--series-3)', 'reward pools'),
             node('ram', RAM, toRam + ramOther, 'var(--series-7)', 'player RAM'),
             node('cpu', CPU, toCpu + cpuOther, 'var(--series-6)', 'player CPU')].concat(
              heldColl > 0 ? [node('heldColl', 'Held in ' + COLLECT, heldColl, G, 'not yet allocated')] : []),

            [node('devOut', 'Developer withdrawals', toDev1 + toDev2, 'var(--series-2)',
                  'leaves the system'),
             node('candle', 'recovery.ale', toCandle, 'var(--series-3)',
                  'the candle — pays players back'),
             node('ramBuy', 'eosio.ram', ramSpent, 'var(--series-7)', 'RAM bought for players'),
             node('cpuBuy', 'eosio.fees', cpuSpent, 'var(--series-6)', 'powerup fees for players')]
             .concat(
              (heldPools + heldRam + heldCpu) > 0
                ? [node('heldLeg', 'Held in those accounts', heldPools + heldRam + heldCpu, G,
                        'pools ' + fmt(heldPools) + ' · ram ' + fmt(heldRam) + ' · cpu ' + fmt(heldCpu))]
                : [])
        ].map(c => c.filter(n => n.wax > 0));

        const links = [{ from: 'shop', to: 'collect', wax: forwarded, color: 'var(--series-1)' }];
        if (carriedIn > 0) links.push({ from: 'carried', to: 'collect', wax: carriedIn, color: G });
        if (otherIn > 0)   links.push({ from: 'otherIn', to: 'collect', wax: otherIn, color: G });
        if (heldShop > 0)  cols[0][0].sub += ' · ' + fmt(heldShop) + ' WAX still in ' + SHOP;
        [['dev1', toDev1], ['dev2', toDev2], ['pools', toPools], ['ram', toRam], ['cpu', toCpu]]
            .forEach(([id, v]) => links.push({ from: 'collect', to: id, wax: v }));
        if (heldColl > 0) links.push({ from: 'collect', to: 'heldColl', wax: heldColl, color: G });
        links.push({ from: 'dev1', to: 'devOut', wax: toDev1 });
        links.push({ from: 'dev2', to: 'devOut', wax: toDev2, color: 'var(--series-5)' });
        links.push({ from: 'pools', to: 'candle', wax: toCandle });
        links.push({ from: 'ram', to: 'ramBuy', wax: ramSpent });
        links.push({ from: 'cpu', to: 'cpuBuy', wax: cpuSpent });
        if (heldPools > 0) links.push({ from: 'pools', to: 'heldLeg', wax: heldPools, color: G });
        if (heldRam > 0)   links.push({ from: 'ram', to: 'heldLeg', wax: heldRam, color: G });
        if (heldCpu > 0)   links.push({ from: 'cpu', to: 'heldLeg', wax: heldCpu, color: G });

        const scaleTotal = Math.max(totalIn + carriedIn, collectIn + carriedIn);
        cols[2].forEach(n => { n.pct = totalOut ? n.wax / totalOut * 100 : 0; });

        // payments out, bucketed by ISO week and grouped the way the split reads
        const weeks = {};
        collect.filter(t => t.from === COLLECT).forEach(t => {
            const d0 = new Date(t.ms);
            const day = (d0.getUTCDay() + 6) % 7;                  // Monday = 0
            const mon = new Date(Date.UTC(d0.getUTCFullYear(), d0.getUTCMonth(), d0.getUTCDate() - day));
            const key = mon.toISOString().slice(0, 10);
            const w = weeks[key] || (weeks[key] = { key: key, ms: mon.getTime(), total: 0 });
            const cat = WEEK_CATS.find(c => c.match(t.to)) || WEEK_CATS[WEEK_CATS.length - 1];
            w[cat.name] = (w[cat.name] || 0) + amt(t.quantity);
            w.total += amt(t.quantity);
        });
        const wRows = Object.values(weeks).sort((a, b) => a.ms - b.ms);
        const maxWeek = Math.max.apply(null, wRows.map(w => w.total)) || 1;

        const months = {};
        buys.forEach(t => {
            const k = new Date(t.ms).toISOString().slice(0, 7);
            const e = months[k] || (months[k] = { key: k, wax: 0, n: 0 });
            e.wax += amt(t.quantity); e.n++;
        });
        const mRows = Object.values(months).sort((a, b) => a.key.localeCompare(b.key));
        const maxM = Math.max.apply(null, mRows.map(m => m.wax));
        const first = new Date(Math.min.apply(null, buys.map(b => b.ms)));
        const last = new Date(Math.max.apply(null, buys.map(b => b.ms)));

        body.innerHTML = tabBar() +
            (short ? '<div class="err">Incomplete read: this node returned ' + shop.length + ' of ' +
                tShop + ' shop.ale and ' + collect.length + ' of ' + tCollect + ' collect.ale transfers, ' +
                'so the figures below understate the real totals. Reload to try again.</div>' : '') +
            '<div class="tiles">' +
              tile('Spent on gems', fmt(totalIn) + ' WAX', 'since ' + first.toISOString().slice(0, 10)) +
              tile('Purchases', fmt(buys.length), buyers.size + ' distinct buyers') +
              tile('To reward pools', fmt(out['pools.ale'] || 0) + ' WAX',
                   fmt1((out['pools.ale'] || 0) / totalOut * 100) + '% of what was split') +
              tile('To player CPU', fmt(out['cpu.ale'] || 0) + ' WAX',
                   fmt1((out['cpu.ale'] || 0) / totalOut * 100) + '% of what was split') +
              tile('Average purchase', fmt(totalIn / buys.length) + ' WAX',
                   'largest pack ' + packRows[0][0]) +
            '</div>' +

            '<section><h2>Where the money goes</h2>' +
            '<p class="note">The full cycle. Players buy gems from <b>shop.ale</b>; the WAX passes to ' +
            '<b>collect.ale</b>, which allocates it. Two shares are withdrawn by the developers and ' +
            'leave the system; the rest comes back to players &mdash; <b>pools.ale</b> funds the candle ' +
            'at recovery.ale, <b>ram.ale</b> buys RAM and <b>cpu.ale</b> pays powerup fees. Balances ' +
            'an account still holds are drawn too, so each column adds up against the one before it. ' +
            'Hover any band for the exact figure.</p>' +
            '<div class="legend">' + cols[2].concat(cols[3].filter(n => n.id === 'candle'))
                .map(d => '<span><i class="swatch" style="background:' + d.color + '"></i>' +
                     d.name + '</span>').join('') +
            '</div>' + drawFlow(cols, links, scaleTotal) + '</section>' +

            '<section><h2>Revenue split</h2>' +
            '<p class="note">Every destination collect.ale paid during ' + scopeLabel() +
            '. Payments out of an escrow are not that period\'s revenue settled &mdash; a draw ' +
            'made now can be money taken in weeks earlier, so in and out need not agree.</p>' +
            '<table><thead><tr><th class="txt">Destination</th><th class="num">WAX</th>' +
            '<th class="num">Share</th><th class="txt">What the memo says</th></tr></thead><tbody>' +
            outRows.map(r => {
                const memo = collect.find(t => t.from === COLLECT && t.to === r[0] && t.memo);
                return '<tr><td class="txt">' + r[0] + '</td><td class="num">' + fmt(r[1]) +
                    '</td><td class="num">' + fmt1(r[1] / totalOut * 100) +
                    '%</td><td class="txt muted">' + ((memo && memo.memo) || '—') + '</td></tr>';
            }).join('') +
            '<tr class="total"><td class="txt">Total split</td><td class="num">' + fmt(totalOut) +
            '</td><td class="num">100%</td><td class="txt"></td></tr>' +
            '</tbody></table></section>' +

            '<section><h2>Weekly collect.ale escrow</h2>' +
            '<p class="note">Each payment out of collect.ale, by week. Reward pools take a cut of ' +
            'every purchase, so that band is continuous; development is drawn in occasional lumps, ' +
            'which is why the shares in the table above are a running total rather than a fixed rule.</p>' +
            '<div class="legend">' + WEEK_CATS.map(c =>
                '<span><i class="swatch" style="background:' + c.color + '"></i>' + c.name + '</span>').join('') +
            '</div>' + drawWeekly(wRows, maxWeek) + '</section>' +

            '<section><h2>Revenue by month</h2>' +
            '<p class="note">WAX spent on gems per calendar month during ' + scopeLabel() +
            ', across ' + mRows.length + ' month' + (mRows.length === 1 ? '' : 's') + '.</p>' +
            drawMonthly(mRows, maxM) + '</section>' +

            '<section><h2>Pack breakdown</h2>' +
            '<table><thead><tr><th class="txt">Pack</th><th class="num">Purchases</th>' +
            '<th class="num">WAX</th><th class="num">Buyers</th><th class="num">Unit price</th>' +
            '<th class="num">Share of revenue</th></tr></thead><tbody>' +
            packRows.map(([k, v]) =>
                '<tr><td class="txt">' + k + '</td><td class="num">' + fmt(v.n) + '</td><td class="num">' +
                fmt(v.wax) + '</td><td class="num">' + v.buyers.size + '</td><td class="num">' +
                fmt(v.wax / v.n) + '</td><td class="num">' + fmt1(v.wax / totalIn * 100) +
                '%</td></tr>').join('') +
            '<tr class="total"><td class="txt">Total</td><td class="num">' + fmt(buys.length) +
            '</td><td class="num">' + fmt(totalIn) + '</td><td class="num">' + buyers.size +
            '</td><td class="num"></td><td class="num">100%</td></tr>' +
            '</tbody></table></section>' +

            '<p class="note">Read from ' + _ep + ' &middot; ' + shop.length + ' shop.ale and ' +
            collect.length + ' collect.ale transfers &middot; last purchase ' +
            last.toISOString().slice(0, 16).replace('T', ' ') + ' UTC.</p>';

        bindAll(body);
    } catch (e) {
        body.innerHTML = tabBar() + '<div class="err">Could not draw — ' +
            ((e && e.message) || e) + '</div>';
    }
}

function scopeLabel() {
    return _scope === 'beta'  ? 'beta, from 1 Sep 2026'
         : _scope === 'alpha' ? 'alpha, before 1 Sep 2026'
         : 'the full history';
}

function tabBar() {
    const tab = (k, label) => '<button class="ops-tab' + (_scope === k ? ' active' : '') +
        '" id="tab-' + k + '" onclick="setOpsScope(\'' + k + '\')">' + label + '</button>';
    const note = _scope === 'beta'  ? 'from 1 Sep 2026'
               : _scope === 'alpha' ? 'before 1 Sep 2026'
               : 'alpha and beta together';
    return '<div class="ops-tabs">' + tab('beta', 'Beta') + tab('alpha', 'Alpha') + tab('all', 'All') +
        '<span class="ops-tab-note">' + note + '</span>' +
        '<button class="ops-csv" onclick="downloadCsv()" title="Every purchase and payout in this ' +
        'period, one row per transfer">&#8681; CSV</button></div>';
}

/* One row per transfer rather than the rolled-up tables: the aggregates here
   can all be rebuilt from it, the reverse is not true. Amounts stay unrounded
   so a spreadsheet total matches the chain exactly. */
window.downloadCsv = function () {
    if (!_data) return;
    const rows = [['timestamp_utc', 'kind', 'from', 'to', 'wax', 'memo', 'pack']];
    _data.shop.filter(inScope)
        .filter(t => t.to === SHOP && /^purchase,/.test(t.memo || ''))
        .sort((a, b) => a.ms - b.ms)
        .forEach(t => rows.push([new Date(t.ms).toISOString(), 'purchase', t.from, t.to,
            amt(t.quantity), t.memo || '', (t.memo || '').split(',')[1] || '']));
    _data.collect.filter(inScope)
        .filter(t => t.from === COLLECT)
        .sort((a, b) => a.ms - b.ms)
        .forEach(t => rows.push([new Date(t.ms).toISOString(), 'payout', t.from, t.to,
            amt(t.quantity), t.memo || '', '']));

    const esc = v => {
        const str = String(v == null ? '' : v);
        return /[",\n]/.test(str) ? '"' + str.replace(/"/g, '""') + '"' : str;
    };
    const csv = rows.map(r => r.map(esc).join(',')).join('\r\n');
    const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
    const a = document.createElement('a');
    a.href = url;
    a.download = 'gem-revenue-' + _scope + '-' + new Date().toISOString().slice(0, 10) + '.csv';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
};

function tile(k, v, s) {
    return '<div class="tile"><div class="k">' + k + '</div><div class="v">' + v + '</div>' +
        (s ? '<div class="s">' + s + '</div>' : '') + '</div>';
}

run();
</script>
</body>
</html>
